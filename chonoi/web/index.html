<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi</title>
<style>
  html, body { margin: 0; height: 100%; background: #10161c; color: #e8eef2; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #dialog { position: absolute; inset: 0; display: grid; place-items: center; background: #0b1f27bd; }
  #dialog[hidden] { display: none; }
  .panel { width: min(90vw, 620px); box-sizing: border-box; padding: 28px; border: 1px solid #95aeb5;
    border-radius: 18px; background: #14272e; color: #faf3e4; font-size: 18px; }
  .panel h1 { margin-top: 0; font: bold 32px Georgia, serif; }
  .panel button { padding: 8px 16px; margin: 5px 8px 5px 0; font: inherit; border: 1px solid #ffd991;
    border-radius: 8px; background: #f5cc80; color: #21221e; cursor: pointer; }
  .panel button:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<canvas id="c" aria-label="Quán Ăn Chợ Nổi. WASD hoặc mũi tên để di chuyển, E để tương tác, Space để bắt cá và R để chơi lại."></canvas>
<div id="dialog" hidden><div class="panel" id="panel"></div></div>
<script>
"use strict";
/*
 * Client chơi trực tiếp (starter). CHỈ ĐỌC snapshot từ GET /state và gửi phím qua POST /input.
 * Phím: WASD / mũi tên = di chuyển · E = interact · Space = catch · R = chơi lại.
 */
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const dialog = document.getElementById("dialog");
const panel = document.getElementById("panel");
let screenKey = "", introTimer;
const command = (path) => fetch(path, {method: "POST"});
const input = (body) => fetch("/input", {method: "POST", body: JSON.stringify(body)});
let snap = null, offline = false;

// ---------- vào: phím ----------
const down = new Set();
const MOVE_KEYS = { w: "u", arrowup: "u", s: "d", arrowdown: "d", a: "l", arrowleft: "l", d: "r", arrowright: "r" };
let queue = [], inflight = false, lastSent = "";

function currentInput() {
  const mode = snap ? snap.phase : "gather";
  const dx = (down.has("r") ? 1 : 0) - (down.has("l") ? 1 : 0);
  let dy = (down.has("d") ? 1 : 0) - (down.has("u") ? 1 : 0);   // gather: xuống = d dương
  if (mode === "quan") dy = -dy;                                // quan: lên (bắc) = z dương
  return { move: [dx, dy], interact: down.has("interact"), catch: down.has("catch"), pause: down.has("pause") };
}
function pushInput() {
  const s = JSON.stringify(currentInput());
  if (s === lastSent) return;
  lastSent = s;
  queue.push(s);
  flush();
}
async function flush() {
  if (inflight) return;
  inflight = true;
  while (queue.length) {
    const body = queue.shift();
    try { await fetch("/input", { method: "POST", body, headers: { "Content-Type": "application/json" } }); }
    catch (e) { /* mất kết nối: poll sẽ báo */ }
  }
  inflight = false;
}
function keyName(e) { return e.key.toLowerCase(); }
addEventListener("keydown", (e) => {
  const k = keyName(e);
  if (e.repeat) { if (k === " " || k.startsWith("arrow")) e.preventDefault(); return; }
  if (snap?.screen && (k === "enter" || !["menu", "summary"].includes(snap.screen))) {
    command("/continue"); e.preventDefault(); return;
  }
  if (k === "escape" || k === "p") { down.add("pause"); e.preventDefault(); }
  if (MOVE_KEYS[k]) { down.add(MOVE_KEYS[k]); e.preventDefault(); }
  else if (k === "e") down.add("interact");
  else if (k === " ") { down.add("catch"); e.preventDefault(); }
  else if (k === "r") { fetch("/restart", { method: "POST" }); lastSent = ""; down.clear(); }
  pushInput();
});
addEventListener("keyup", (e) => {
  const k = keyName(e);
  if (k === "escape" || k === "p") down.delete("pause");
  if (MOVE_KEYS[k]) down.delete(MOVE_KEYS[k]);
  else if (k === "e") down.delete("interact");
  else if (k === " ") down.delete("catch");
  pushInput();
});
addEventListener("blur", () => { down.clear(); pushInput(); });

// ---------- ra: poll snapshot ----------
async function poll() {
  try {
    const r = await fetch("/state", { cache: "no-store" });
    snap = await r.json();
    offline = false;
    updateDialog();
  } catch (e) { offline = true; }
  setTimeout(poll, 16);
}
poll();

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";
const DISH_NAME = {
  ca_loc_nuong_trui: "Cá lóc nướng trui",
  goi_bong_sung: "Gỏi bông súng",
  lau_ca_linh_dien_dien: "Lẩu cá linh điên điển",
  canh_chua_ca_loc: "Canh chua cá lóc bông điên điển",
  ca_keo_nuong: "Cá kèo nướng muối ớt",
  lau_mam: "Lẩu mắm miền Tây",
};
const dishName = (dish) => DISH_NAME[dish] || dish;
function contents(stock) {
  if (!Array.isArray(stock)) return stock || {};
  const quantities = {};
  for (const item of stock) {
    const kind = typeof item === "string" ? item : item.kind;
    quantities[kind] = (quantities[kind] || 0) + 1;
  }
  return quantities;
}
function quantities(stock) {
  return Object.entries(contents(stock)).map(([k, n]) => `${KIND_NAME[k] || k} ×${n}`).join(", ") || "Kho trống";
}
function updateDialog() {
  const view = snap.state === "paused" ? "pause" : snap.screen || (snap.phase === "shop" ? "shop" : "");
  dialog.hidden = !view;
  const key = JSON.stringify([view, snap.day, snap.upgrades, snap.money]);
  if (key === screenKey) return;
  screenKey = key;
  clearTimeout(introTimer);
  if (!view) return;
  panel.replaceChildren();
  function line(value, tag = "p") {
    const element = document.createElement(tag);
    element.textContent = value;
    panel.append(element);
  }
  function button(label, callback, disabled = false) {
    const element = document.createElement("button");
    element.textContent = label;
    element.disabled = disabled;
    element.addEventListener("click", callback);
    panel.append(element);
  }
  const advance = () => command("/continue");
  if (view === "menu") {
    line("Quán Ăn Chợ Nổi", "h1");
    line("Giúp Út Sen lấy nguyên liệu vào buổi sáng và phục vụ khách ở nhà bè vào buổi tối.");
    button("Chơi", advance);
    button("Thoát", () => { line("Đã thoát ván. Bạn có thể đóng thẻ trình duyệt."); });
  } else if (view === "intro") {
    line(`Ngày ${snap.day} · Thực đơn của Má Tư`, "h1");
    line(Object.entries(snap.day_plan.dishes).map(([dish, q]) => `${dishName(dish)} ×${q}`).join(", "));
    line("Cần lấy " + quantities(snap.day_plan.ingredients));
    button("Ra sông", advance);
    introTimer = setTimeout(advance, 4000);
  } else if (view === "evening") {
    line(`Ngày ${snap.day} · Mở quán`, "h1");
    line(quantities(snap.stock));
    line(Object.keys(snap.day_plan.dishes).map(dishName).join(", "));
    button("Đón khách", advance);
  } else if (view === "result") {
    line("Kết quả buổi tối", "h1");
    const results = snap.summary;
    line(`Phục vụ ${results.served} · Khách rời ${results.left} · Thu ${results.income}k · Boa ${results.tips}k`);
    button("Mở cửa hàng", advance);
  } else if (view === "shop") {
    line(`Cửa hàng · ${snap.money}k`, "h1");
    for (const [name, levels] of Object.entries(snap.options)) {
      const level = snap.upgrades[name] || 0;
      const label = name === "oxygen" ? "Bình oxy" : "Áo phao";
      const next = levels[level];
      button(next ? `${label} cấp ${next.level} · ${next.price}k` : `${label} đã tối đa`,
        () => input({buy: name}), !next || next.price > snap.money);
    }
    button("Đóng cửa hàng", async () => {
      await input({shop_done: true});
      await input({shop_done: false});
    });
  } else if (view === "pause") {
    line("Tạm dừng", "h1");
    button("Tiếp tục", async () => {
      await input({pause: false}); await input({pause: true}); await input({pause: false});
    });
    button("Về menu", () => command("/restart"));
  } else if (view === "summary") {
    line("Tổng kết", "h1");
    line(`Số dư ${snap.money}k · Tổng thu ${snap.earned}k · Uy tín ${snap.reputation} · Điểm ${snap.score}`);
    button("Về menu", advance);
  }
}

const END_REASON = {
  docked: "Út Sen đã cập bến",
  fainted: "Út Sen ngất vì thiếu oxy",
  time: "Hết giờ",
  error: "Có lỗi khi chạy trò chơi",
};

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth, h = innerHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, o = {}) {
  ctx.font = (o.size || 14) + "px system-ui, sans-serif";
  ctx.fillStyle = o.color || "#e8eef2";
  ctx.textAlign = o.align || "left";
  ctx.textBaseline = o.base || "alphabetic";
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, frac, color, label) {
  ctx.fillStyle = "rgba(0,0,0,.45)"; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, frac)), h);
  ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
  if (label) text(label, x + w / 2, y + h - 3, { size: 11, align: "center" });
}
function fmtTime(ticks) {
  const s = Math.ceil(ticks / 60);
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function eventMessage(event) {
  const d = event.data;
  switch (event.name) {
    case "gather":
    case "fish_caught": return `+ ${(d.amount ?? d.yield)} ${KIND_NAME[d.kind]}`;
    case "hold_full": return "Giỏ đã đầy";
    case "oxygen_empty": return "Hết oxy. Bơi lên mặt nước!";
    case "choke": return `Thiếu oxy · còn ${d.hp} máu`;
    case "customer_arrived": return `Bàn ${d.table_id} gọi ${dishName(d.dish_id)}`;
    case "no_dish": return "Chưa đủ nguyên liệu để nhận thêm khách";
    case "customer_left": return `Khách ở bàn ${d.table_id} đã rời đi`;
    case "cook_started": return `Đang nấu ${dishName(d.dish_id)}`;
    case "dish_ready": return `${dishName(d.dish_id)} đã chín`;
    case "served": return `Đã phục vụ bàn ${d.table_id}`;
    case "paid": return d.tip ? `+ ${d.amount}k (boa ${d.tip}k)` : `+ ${d.amount}k`;
    default: return "";
  }
}
function eventLog(w, h) {
  const messages = (snap.events || []).filter((e) => snap.tick - e.tick < 210)
    .map(eventMessage).filter(Boolean).slice(-3);
  messages.forEach((message, i) => text(message, w - 14, h - 46 - (messages.length - 1 - i) * 17,
    { size: 13, align: "right", color: "#f6ead7" }));
}
function overlay(w, h) {
  if (offline) text("Mất kết nối tới máy chủ (đã tắt chưa?)", w / 2, 30, { align: "center", color: "#ff8a80", size: 16 });
  if (snap.error) text("Luật của nhóm báo lỗi — xem terminal. R để chơi lại.", w / 2, 52, { align: "center", color: "#ff8a80", size: 15 });
  if (snap.finished) {
    const width = Math.min(430, w - 24);
    ctx.fillStyle = "rgba(12,24,30,.93)";
    ctx.fillRect((w - width) / 2, h / 2 - 66, width, 132);
    text(END_REASON[snap.reason] || "Kết thúc buổi chơi", w / 2, h / 2 - 25, { align: "center", size: 19 });
    const result = snap.phase === "gather"
      ? `Nguyên liệu trong giỏ · ${snap.hold_count}`
      : `Tiền ${snap.money}k · Điểm ${snap.score}`;
    text(result, w / 2, h / 2 + 4, { align: "center", color: "#f6ead7" });
    text("Nhấn R để chơi lại", w / 2, h / 2 + 34, { align: "center", color: "#a4c2cc" });
  }
}

// ----- cảnh GATHER: nhìn ngang, x sang phải, d xuống -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 64, bottom = 56;
  const s = Math.max(1, Math.min((w - 20) / (X + 4), (h - top - bottom) / (D + SKY + 1)));
  const ox = (w - s * (X + 4)) / 2 + 2 * s, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;
  // trời + nước
  ctx.fillStyle = "#cfeaf5"; ctx.fillRect(0, top, w, SKY * s);
  const g = ctx.createLinearGradient(0, oy, 0, sy(D));
  g.addColorStop(0, "#49b0dc"); g.addColorStop(1, "#08243f");
  ctx.fillStyle = g; ctx.fillRect(sx(0), oy, X * s, D * s);
  ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();
  // vạch độ sâu
  for (let d = 5; d <= D; d += 5) {
    ctx.strokeStyle = "rgba(255,255,255,.08)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
    text(d + " m", sx(0) + 4, sy(d) - 2, { size: 10, color: "rgba(255,255,255,.4)" });
  }
  // bến
  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#8d6e4b"; ctx.fillRect(sx(dp[0] - 1.5), sy(-0.7), 3 * s, 0.9 * s);
  ctx.fillStyle = "#b9503a"; ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "rgba(255,230,150,.7)"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  text("Bến (E)", sx(dp[0]), sy(-2.8), { size: 11, align: "center", color: "#5a3a22" });
  // nút hái
  (snap.nodes || []).forEach((n) => {
    const ready = n.ready !== false;
    ctx.globalAlpha = ready ? 1 : 0.35;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    text(n.id, sx(n.pos[0]), sy(n.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "#234" });
    if (!ready && n.regrow_ticks) text(Math.ceil(n.regrow_ticks / 60) + "s", sx(n.pos[0]), sy(n.pos[1]) + 1.1 * s, { size: 10, align: "center", color: "#fff" });
  });
  // đàn cá
  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.8 * s, 0); ctx.lineTo(-1.4 * s, -0.4 * s); ctx.lineTo(-1.4 * s, 0.4 * s); ctx.fill();
    ctx.restore();
    text(f.id, sx(f.pos[0]), sy(f.pos[1]) - 0.7 * s, { size: 10, align: "center", color: "rgba(255,255,255,.8)" });
  });
  for (const monster of snap.monsters || []) {
    const [x, d] = monster.pos;
    ctx.fillStyle = "#527d46";
    ctx.beginPath(); ctx.ellipse(sx(x), sy(d), 1.7 * s, .55 * s, 0, 0, Math.PI * 2); ctx.fill();
    text("Cá Sấu", sx(x), sy(d) - .8 * s, {size: 12, align: "center"});
  }
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    const underwater = p.at_surface === undefined ? p.pos[1] > 0.5 : !p.at_surface;
    if (meta.catch_radius && underwater) { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(px, py, meta.catch_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (meta.interact_radius && !underwater) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); }
    if (!(p.invuln_ticks > 0 && Math.floor(snap.tick / 5) % 2)) {
      ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.6 * s, 0, Math.PI * 2); ctx.fill();
      const a = ((p.heading_deg || 0) * Math.PI) / 180;
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + Math.cos(a) * 0.9 * s, py + Math.sin(a) * 0.9 * s); ctx.stroke();
    }
  }
  // HUD trên
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  if (p && p.oxygen_ticks !== undefined && p.oxygen_max_ticks) {
    const low = p.oxygen_ticks < p.oxygen_max_ticks * 0.25;
    bar(110, 12, 220, 18, p.oxygen_ticks / p.oxygen_max_ticks, low ? "#ef5350" : "#4fc3f7", "Oxy " + Math.ceil(p.oxygen_ticks / 60) + "s");
  }
  if (p && p.hp !== undefined && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥" : "♡";
    text(hs, 345, 29, { size: 22, color: "#ff6b81" });
  }
  if (p && p.pos) text(`x ${p.pos[0].toFixed(1)}  d ${p.pos[1].toFixed(1)}`, 14, 52, { size: 12, color: "#9fb3c0" });
  if (p && p.catch_cd_ticks > 0) text("hồi chiêu bắt " + (p.catch_cd_ticks / 60).toFixed(1) + "s", 150, 52, { size: 12, color: "#9fb3c0" });
  if (snap.day_plan) {
    const found = contents(snap.hold);
    const targets = Object.entries(snap.day_plan.ingredients).map(([k, n]) => `${KIND_NAME[k]} ${found[k] || 0}/${n}`);
    text(`Ngày ${snap.day} · ${targets.join(" · ")}`, w - 14, 34, {size: 15, align: "right"});
  }
  // giỏ (khoang) dưới
  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.max(8, Math.min(30, (w - 28) / cap - 4)), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) { ctx.fillStyle = kc(snap.hold[i]); ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6); }
    }
    const names = {}; snap.hold.forEach((k) => (names[k] = (names[k] || 0) + 1));
    text("Giỏ " + snap.hold.length + "/" + cap + "  " + Object.keys(names).map((k) => (KIND_NAME[k] || k) + "×" + names[k]).join(", "), 14, y0 + sz + 16, { size: 12, color: "#cfd8dc" });
  }
  text("WASD/mũi tên bơi · E hái / cập bến · Space bắt cá · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN: nhìn từ trên xuống, x sang phải, z lên (bắc) -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 64, bottom = 40;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;
  ctx.fillStyle = "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);
  // bếp
  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 4, { size: 12, align: "center", color: "#111" });
    if (st.dish) text(dishName(st.dish.dish_id), sx(st.pos[0]), sy(st.pos[1]) - 0.95 * s, { size: 10, align: "center", color: "#2a1a0a" });
    if (st.state === "cooking" && st.cook_ticks_left !== undefined) text(Math.ceil(st.cook_ticks_left / 60) + "s", sx(st.pos[0]), sy(st.pos[1]) + 1.25 * s, { size: 11, align: "center", color: "#2a1a0a" });
  });
  // bàn + khách
  const patMax = (meta.patience_s || 60) * 60;
  const byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    text(tb.id, sx(tb.pos[0]), sy(tb.pos[1]) + 4, { size: 12, align: "center", color: "#fff" });
    const c = byTable[tb.id];
    if (c) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]) - 1.5 * s;
      ctx.fillStyle = c.state === "eating" ? "#7bc67b" : "#f4b6c2"; ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      text(dishName(c.dish_id || "?"), cx, cy - 0.75 * s, { size: 10, align: "center", color: "#2a1a0a" });
      if (c.state === "waiting") {
        bar(cx - 0.8 * s, cy + 0.65 * s, 1.6 * s, 5, c.patience_ticks_left / patMax, "#e57373");
      } else if (c.state === "eating") {
        text(`Đang ăn · ${Math.ceil(c.eat_ticks_left / 60)}s`, cx, cy + 0.92 * s,
          { size: 10, align: "center", color: "#2a1a0a" });
      }
    }
  });
  // người chơi
  const p = snap.player;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    if (meta.interact_radius) { ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.arc(px, py, meta.interact_radius * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle = "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hand = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + dishName(hand), px, py - 0.8 * s, { size: 11, align: "center", color: "#2a1a0a" });
    }
  }
  // HUD
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 28, { size: 20 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 110, 28, { size: 16 });
  const stock = quantities(snap.stock);
  text("Kho: " + (stock || "(trống)"), 14, 52, { size: 13, color: "#cfd8dc" });
  text("WASD/mũi tên đi · E tương tác (bếp / bàn) · R chơi lại", w - 10, h - 14, { size: 12, align: "right", color: "#9fb3c0" });
}

function frame() {
  requestAnimationFrame(frame);  // đặt trước để lỗi vẽ không làm dừng vòng lặp
  const [w, h] = fit();
  ctx.fillStyle = "#10161c"; ctx.fillRect(0, 0, w, h);
  if (snap) {
    if (snap.phase === "quan") drawQuan(w, h);
    else if (snap.phase === "gather") drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 18 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
